name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify version match
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MODULE_VERSION=$(grep '"version"' src/module.json | head -1 | sed 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/')
          if [ "$TAG_VERSION" != "$MODULE_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) != module.json version ($MODULE_VERSION)"
            exit 1
          fi
          echo "Version check passed: $TAG_VERSION"

      - name: Create Release (manual build required)
        uses: softprops/action-gh-release@v1
        with:
          body: |
            WaveWarp requires the Vital source tree to build.
            Build locally with `VITAL_ROOT=/path/to/vital ./scripts/build.sh`
            then upload `dist/wavewarp-module.tar.gz` to this release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
